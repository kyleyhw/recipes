# Pre-commit hooks.
#
# The global standards specify ruff / ty / detect-secrets for Python projects.
# This project is TypeScript, so the intent of each rule is preserved with its
# TypeScript equivalent (see docs/architecture.md, "Toolchain mapping"):
#
#   ruff lint + format  ->  eslint + prettier
#   ty (type checking)  ->  tsc --noEmit
#   detect-secrets      ->  unchanged; it is language-agnostic
#
# Install once per clone:
#     uvx pre-commit install
# or, if pre-commit is on PATH:
#     pre-commit install
#
# Run against everything without committing:
#     uvx pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Recipe photos ARE committed — a static site has no blob store, so
        # public/photos/ is the deployed artefact. They are cropped to
        # 1200x675 WebP first and land around 100-200 kB, so anything over
        # half a megabyte is a full-size camera file that skipped the resize.
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig\.json$ # contains comments (JSONC), which Next accepts
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The lockfile is large, machine-generated, and full of base64 integrity
        # hashes that trip the high-entropy detectors.
        exclude: ^(package-lock\.json|\.secrets\.baseline)$

  # Local hooks: these run the project's own toolchain rather than a pinned
  # mirror, so the versions used here are exactly those in package-lock.json.
  - repo: local
    hooks:
      # First, and deliberately not dependent on anything being fetched. Every
      # other hook here comes from a pinned GitHub repo, so a machine that
      # cannot reach GitHub installs none of them; this one is a file in the
      # repository and runs regardless.
      - id: no-api-keys
        name: no API keys
        entry: scripts/no-api-keys.sh
        language: system
        types: [text]

      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [ts, tsx, css, json, yaml]
        exclude: ^(package-lock\.json|prisma/migrations/)

      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: typecheck
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npx vitest run
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
